name: Check and build desktop

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.target }} x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux
            app: linux-unpacked
          - os: windows-2025
            target: windows
            app: win-unpacked
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download Electron test runtime
        run: npm run install:electron
      - name: Install Linux test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0t64 libnss3 libasound2t64 libgbm1 fonts-liberation openbox x11-utils
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Check TypeScript
        run: npm run check
      - name: Test on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1920x1080x24" bash scripts/test-linux-display.sh npm test
      - name: Test on Windows
        if: runner.os == 'Windows'
        run: npm test
      - name: Test translator adapter protocol
        run: python -B tests/translator-protocol.test.py
      - name: Build package
        run: npm run dist:${{ matrix.target }}
      - name: Verify packaged resources on Linux
        if: runner.os == 'Linux'
        env:
          FABLES_TEST_APP_ROOT: ${{ github.workspace }}/out/releases/${{ matrix.app }}/resources/app.asar
        run: xvfb-run -a -s "-screen 0 1920x1080x24" bash scripts/test-linux-display.sh npm run test:appearance && xvfb-run -a -s "-screen 0 1920x1080x24" bash scripts/test-linux-display.sh npm run test:translation && xvfb-run -a -s "-screen 0 1920x1080x24" bash scripts/test-linux-display.sh npm run test:panel
      - name: Verify packaged resources on Windows
        if: runner.os == 'Windows'
        env:
          FABLES_TEST_APP_ROOT: ${{ github.workspace }}/out/releases/${{ matrix.app }}/resources/app.asar
        run: npm run test:appearance && npm run test:translation && npm run test:panel
      - name: Verify included Windows translation model
        if: runner.os == 'Windows'
        run: npm run test:bundled-model
      - name: Generate checksums
        run: node scripts/release-checksums.cjs ${{ matrix.target }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: friends-and-fables-${{ matrix.target }}-x64
          path: |
            out/releases/*.AppImage
            out/releases/*.exe
            out/releases/SHA256SUMS-*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
